<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personalizá tu experiencia · Tribu Connection</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/assets/isotipo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Protest+Strike&family=Caveat:wght@400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tribu.css?v=28">
<link rel="stylesheet" href="/assets/home.css?v=6">
<style>
  .cat-chip{ display:inline-flex; align-items:center; padding:.45rem .9rem; border-radius:999px; border:1px solid var(--line-2); background:var(--ink-1); color:var(--soft); font-size:.85rem; cursor:pointer; transition:.15s; margin:0 .4rem .4rem 0; }
  .cat-chip.sel{ background:var(--spectrum); color:#15110f; border-color:transparent; font-weight:600; }
  .modalidad-toggle{ display:flex; gap:.6rem; }
  .modalidad-toggle button{ flex:1; padding:.7rem; border-radius:14px; border:1px solid var(--line-2); background:var(--ink-1); color:var(--soft); cursor:pointer; font-family:var(--font-sans); font-weight:600; font-size:.88rem; }
  .modalidad-toggle button.active{ background:var(--spectrum); color:#15110f; border-color:transparent; }
  .onb-step{ color:var(--muted); font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; margin-bottom:.5rem; }
  .onb-actions{ display:flex; gap:.8rem; margin-top:1.6rem; }
  .onb-actions .btn--ghost{ flex:none; }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

<nav class="nav" id="nav">
  <a href="/" class="brand" aria-label="Tribu Connection — inicio">
    <img class="brand-full" src="/assets/logo-blanco.png?v=1" alt="Tribu Connection">
  </a>
  <div class="nav-links">
    <a href="/">Inicio</a>
    <a href="/agenda/">Agenda</a>
    <a href="/red-tribu/">Red Tribu</a>
  </div>
  <div class="nav-cta">
    <a href="#" id="btnLogout" class="btn btn--ghost">Cerrar sesión</a>
    <button class="burger" id="burger" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</nav>
<div class="mobile-menu" id="mobileMenu">
  <a href="/">Inicio</a>
  <a href="/agenda/">Agenda</a>
  <a href="/red-tribu/">Red Tribu</a>
  <a href="#" id="btnLogoutMobile" class="btn btn--ghost">Cerrar sesión</a>
</div>

<section class="section" style="padding-top:clamp(110px,14vw,140px)">
  <div class="wrap" style="max-width:640px">
    <p class="onb-step reveal">Paso 2 de 3</p>
    <h1 class="h2 reveal d1" style="margin:0 0 .5rem">Personalizá tu experiencia</h1>
    <p class="lead reveal d1" style="margin-bottom:1.4rem">Contanos un poco más sobre vos para mostrarte beneficios, planes y recomendaciones más afines.</p>

    <div class="tribu-card reveal d2">
      <form id="formPersonalizar">
        <div class="row2">
          <div class="field">
            <label>Modalidad</label>
            <div class="modalidad-toggle">
              <button type="button" data-mod="Presencial" class="active">Presencial</button>
              <button type="button" data-mod="Online">Online</button>
              <button type="button" data-mod="Ambas">Ambas</button>
            </div>
          </div>
          <div class="field">
            <label for="ciudad">Ciudad o barrio</label>
            <input id="ciudad" placeholder="Ej: Buenos Aires, Argentina">
          </div>
        </div>

        <div class="field">
          <label>¿Qué te mueve?</label>
          <div id="intereses"></div>
        </div>

        <div class="field">
          <label>¿Qué te interesa más?</label>
          <div id="interesEn"></div>
        </div>

        <div class="field">
          <label>¿Qué querés recibir?</label>
          <div id="quiereRecibir"></div>
        </div>

        <p class="field-error" id="perError" style="display:none"></p>
        <div class="onb-actions">
          <a href="/cuenta/" class="btn btn--ghost">Volver</a>
          <button type="submit" class="btn btn--spectrum" id="btnContinuar">Continuar</button>
        </div>
        <p style="color:var(--muted);font-size:.78rem;margin-top:.8rem">Después vas a poder editar estas preferencias cuando quieras.</p>
      </form>
    </div>
  </div>
</section>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="/assets/supabase-client.js?v=4"></script>
<script src="/assets/site.js?v=7"></script>
<script>
(function(){
  let session = null;
  let modalidad = 'Presencial';
  const intereses = [];
  const interesEn = [];
  const quiereRecibir = [];

  function cerrarSesion(e){ e.preventDefault(); tribuCerrarSesion(); }
  document.getElementById('btnLogout').addEventListener('click', cerrarSesion);
  document.getElementById('btnLogoutMobile').addEventListener('click', cerrarSesion);

  function armarChips(containerId, opciones, seleccionadas){
    const box = document.getElementById(containerId);
    opciones.forEach(op => {
      const chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'cat-chip'; chip.textContent = op;
      chip.addEventListener('click', () => {
        const i = seleccionadas.indexOf(op);
        if(i > -1){ seleccionadas.splice(i, 1); chip.classList.remove('sel'); }
        else { seleccionadas.push(op); chip.classList.add('sel'); }
      });
      box.appendChild(chip);
    });
  }
  armarChips('intereses', INTERESES_TRIBU, intereses);
  armarChips('interesEn', INTERES_EN_TRIBU, interesEn);
  armarChips('quiereRecibir', QUIERE_RECIBIR_TRIBU, quiereRecibir);

  document.querySelectorAll('.modalidad-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.modalidad-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      modalidad = btn.dataset.mod;
    });
  });

  document.getElementById('formPersonalizar').addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('perError'); err.style.display = 'none';
    const btn = document.getElementById('btnContinuar'); btn.textContent = 'Guardando...'; btn.disabled = true;
    try{
      const { error } = await sb.from('profiles').upsert({
        id: session.user.id,
        email: session.user.email,
        ciudad: document.getElementById('ciudad').value.trim() || null,
        modalidad_pref: modalidad,
        intereses,
        interes_en: interesEn,
        quiere_recibir: quiereRecibir
      });
      if(error) throw error;
      window.location.href = '/cuenta/onboarding/participacion/';
    }catch(ex){
      err.textContent = 'No se pudo guardar: ' + ex.message;
      err.style.display = 'block';
      btn.textContent = 'Continuar'; btn.disabled = false;
    }
  });

  (async () => {
    session = await tribuRequiereSesion();
  })();
})();
</script>
</body>
</html>
