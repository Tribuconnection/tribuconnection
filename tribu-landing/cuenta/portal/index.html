<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mi portal · Tribu Connection</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C0D10">
<link rel="icon" type="image/png" href="/assets/isotipo.png?v=3">
<link rel="manifest" href="/cuenta/portal/manifest.json">
<link rel="apple-touch-icon" href="/assets/pwa-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi portal Tribu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Protest+Strike&family=Caveat:wght@400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tribu.css?v=48">
<style>
  body{ padding-top:76px; }
  [hidden]{ display:none !important; }

  /* ---------- Header del portal ---------- */
  .pt-head{ position:fixed; top:0; left:0; right:0; z-index:60; height:76px; background:rgba(12,13,16,.84); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top); }
  .pt-head-in{ max-width:1100px; height:100%; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:.9rem; }
  .pt-iso{ width:38px; height:38px; flex:none; display:block; }
  .pt-iso img{ width:100%; height:100%; object-fit:contain; }
  .pt-me{ display:flex; align-items:center; gap:.7rem; min-width:0; flex:1; }
  .pt-me-av{ width:44px; height:44px; border-radius:50%; flex:none; padding:2px; background:var(--spectrum); }
  .pt-me-av span{ display:block; width:100%; height:100%; border-radius:50%; overflow:hidden; background:var(--ink-2); position:relative; }
  .pt-me-av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .pt-me-av b{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; }
  .pt-me-txt{ min-width:0; line-height:1.15; }
  .pt-me-txt strong{ display:block; font-size:.98rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pt-me-txt small{ display:block; font-size:.66rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); margin-top:.2rem; }
  .pt-ic{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line-2); background:transparent; color:var(--cream); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; font-family:var(--font-sans); font-weight:700; font-size:.78rem; letter-spacing:.12em; text-decoration:none; transition:.15s; }
  .pt-ic:hover{ border-color:var(--cream); background:rgba(255,255,255,.04); }
  .pt-ic.is-plain{ border-color:transparent; }

  /* ---------- Estructura ---------- */
  .pt-wrap{ max-width:1100px; margin:0 auto; padding:0 16px; }
  .pt-sec{ padding:3rem 0; text-align:center; }
  .pt-eyebrow{ font-size:.74rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--amber); }
  .pt-title{ font-family:var(--font-accent); font-weight:400; font-size:clamp(1.75rem,4.2vw,2.6rem); line-height:1.08; margin-top:.5rem; text-wrap:balance; }
  .pt-sub{ color:var(--soft); max-width:58ch; margin:.9rem auto 0; line-height:1.6; font-size:.98rem; }
  .pt-sep{ display:flex; align-items:center; justify-content:center; gap:.7rem; margin:.4rem auto; max-width:320px; }
  .pt-sep i{ flex:1; height:2px; border-radius:2px; background:var(--spectrum); opacity:.75; }
  .pt-sep img{ width:28px; height:28px; object-fit:contain; }
  .pt-btns{ display:flex; flex-wrap:wrap; justify-content:center; gap:.7rem; margin-top:1.4rem; }
  .pt-btn-sm{ padding:.62rem 1.25rem !important; font-size:.84rem !important; }

  /* ---------- Hero ---------- */
  .pt-hero{ padding-top:2.6rem; }
  .pt-foto{ position:relative; width:min(300px,72vw); aspect-ratio:4/5; margin:0 auto; border-radius:28px; overflow:hidden; background:var(--ink-2); border:1px solid var(--line-2); box-shadow:0 30px 70px -30px rgba(0,0,0,.85), 0 0 0 6px rgba(255,255,255,.02); }
  .pt-foto img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .pt-foto.is-ph{ background:linear-gradient(135deg, rgba(210,75,98,.35), rgba(244,166,35,.28) 45%, rgba(54,183,196,.3)); display:flex; align-items:center; justify-content:center; }
  .pt-foto.is-ph img{ position:static; width:42%; height:auto; object-fit:contain; }
  .pt-badge{ display:inline-flex; margin-top:1.5rem; padding:.42rem 1rem; border-radius:999px; border:1px solid color-mix(in srgb, var(--amber) 70%, transparent); color:var(--amber); font-size:.72rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; }
  .pt-nombre{ font-family:var(--font-accent); font-weight:400; font-size:clamp(2.3rem,7vw,3.8rem); line-height:1; margin-top:.9rem; text-transform:uppercase; text-wrap:balance; }
  .pt-titulo{ color:var(--teal); font-size:1.08rem; margin-top:.6rem; }
  .pt-bienv{ font-family:var(--font-accent); font-weight:400; font-size:clamp(1.3rem,3vw,1.75rem); margin-top:2.2rem; text-wrap:balance; }

  /* ---------- Instalar ---------- */
  .pt-install{ max-width:620px; margin:2rem auto 0; display:flex; gap:1rem; align-items:flex-start; text-align:left; padding:1.2rem 1.3rem; border-radius:24px; border:1px solid var(--line-2); background:linear-gradient(160deg, var(--ink-2), var(--ink-1)); }
  .pt-install > img{ width:52px; height:52px; border-radius:14px; flex:none; }
  .pt-install h3{ font-family:var(--font-sans); font-size:.86rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); }
  .pt-install p{ color:var(--soft); font-size:.92rem; margin-top:.25rem; line-height:1.45; }
  .pt-install .row{ display:flex; align-items:center; gap:1rem; margin-top:.8rem; flex-wrap:wrap; }
  .pt-link-btn{ background:none; border:0; color:var(--soft); font-family:var(--font-sans); font-size:.82rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; text-decoration:underline; text-underline-offset:4px; cursor:pointer; padding:.3rem 0; }
  .pt-link-btn:hover{ color:var(--cream); }

  /* ---------- Placas ---------- */
  .pt-placas{ display:grid; grid-template-columns:.8fr .5625fr; gap:1.4rem; max-width:820px; margin:1.8rem auto 0; align-items:start; }
  @media (max-width:560px){ .pt-placas{ gap:.7rem; } }
  .pt-placa h4, .pt-mini h4{ font-family:var(--font-sans); font-size:.72rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); margin-bottom:.7rem; }
  @media (max-width:560px){ .pt-placa h4{ font-size:.6rem; letter-spacing:.08em; } }
  .pt-cv{ position:relative; border-radius:22px; overflow:hidden; background:var(--ink-2); box-shadow:0 26px 60px -28px rgba(0,0,0,.9); line-height:0; }
  @media (max-width:560px){ .pt-cv{ border-radius:14px; } }
  .pt-cv canvas{ width:100%; height:auto; display:block; }
  .editando .pt-cv, .pt-extra .pt-cv{ outline:2px dashed color-mix(in srgb, var(--amber) 80%, transparent); outline-offset:4px; }
  .editando .pt-cv canvas, .pt-extra .pt-cv canvas{ cursor:grab; touch-action:none; }
  .editando .pt-cv canvas:active, .pt-extra .pt-cv canvas:active{ cursor:grabbing; }
  .pt-placa .btn{ margin-top:1rem; white-space:nowrap; }
  .pt-caption .btn{ white-space:nowrap; flex:none; }
  @media (max-width:560px){ .pt-placa .btn{ font-size:.74rem !important; padding:.55rem .8rem !important; } }
  .editando .pt-desc{ visibility:hidden; }
  .pt-cv-spin{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(12,13,16,.6); color:var(--soft); font-size:.86rem; line-height:1.3; }

  .pt-editor{ max-width:620px; margin:1.6rem auto 0; }
  .pt-editor p{ color:var(--soft); font-size:.95rem; line-height:1.5; }
  .pt-zoom{ display:flex; align-items:center; gap:1rem; margin-top:1.1rem; }
  .pt-zoom label{ font-size:.74rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--soft); }
  .pt-zoom input[type=range]{ flex:1; -webkit-appearance:none; appearance:none; height:8px; border-radius:999px; background:var(--ink-3); outline:none; }
  .pt-zoom input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:var(--amber); border:3px solid var(--ink); box-shadow:0 0 0 1px var(--amber); cursor:pointer; }
  .pt-zoom input[type=range]::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:var(--amber); border:3px solid var(--ink); cursor:pointer; }
  .pt-nota{ color:var(--muted) !important; font-size:.84rem !important; margin-top:1rem; }
  .pt-savebar{ position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:70; display:flex; align-items:center; gap:1.2rem; padding:.6rem .6rem .6rem 1.5rem; border-radius:999px; border:1px solid var(--line-2); background:rgba(16,18,24,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 20px 50px -18px rgba(0,0,0,.9); width:max-content; max-width:calc(100% - 32px); }

  /* ---------- Redes ---------- */
  .pt-mencion{ display:inline-block; max-width:560px; margin-top:1.4rem; padding:1rem 1.4rem; border-radius:22px; border:1px solid var(--line-2); background:rgba(255,255,255,.03); color:var(--soft); line-height:1.6; font-size:.95rem; }
  .pt-mencion b{ color:var(--cream); font-weight:600; }
  .pt-h3{ font-family:var(--font-sans); font-size:.8rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--amber); margin-top:2.4rem; }
  .pt-carrusel{ display:flex; gap:1.1rem; overflow-x:auto; scroll-snap-type:x mandatory; padding:1.2rem 16px 1rem; margin:0 -16px; scrollbar-width:none; -ms-overflow-style:none; cursor:grab; }
  .pt-carrusel::-webkit-scrollbar{ display:none; }
  .pt-carrusel img, .pt-carrusel canvas{ -webkit-user-drag:none; user-select:none; }
  /* Mientras se arrastra: manito cerrada y sin imán, para que siga al mouse. */
  .pt-carrusel.arrastrando{ cursor:grabbing; scroll-snap-type:none; scroll-behavior:auto; }
  .pt-mini{ flex:none; width:280px; scroll-snap-align:center; }
  @media (max-width:560px){ .pt-mini{ width:74vw; } }
  .pt-mini h4{ margin:.9rem 0 .6rem; color:var(--soft); font-size:.7rem; }
  .pt-caption{ max-width:620px; margin:1.6rem auto 0; text-align:left; border:1px solid var(--line); border-radius:20px; background:var(--ink-1); padding:1.1rem 1.2rem; }
  .pt-caption p{ color:var(--soft); font-size:.92rem; line-height:1.55; white-space:pre-line; }
  .pt-caption .row{ display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:.6rem; }
  .pt-caption .row span{ font-size:.72rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }

  /* ---------- Extra ---------- */
  .pt-drop{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8rem; width:min(400px,100%); aspect-ratio:4/5; margin:1.6rem auto 0; border-radius:26px; border:1.5px dashed var(--line-2); background:rgba(255,255,255,.025); cursor:pointer; color:var(--cream); font-family:var(--font-accent); font-size:1.3rem; transition:.15s; }
  .pt-drop:hover, .pt-drop.over{ border-color:var(--amber); background:rgba(244,166,35,.05); }
  .pt-drop svg{ color:var(--amber); }
  .pt-extra{ margin-top:2rem; padding-top:1.6rem; border-top:1px solid var(--line); }
  .pt-extra:first-child{ border-top:0; padding-top:0; }

  /* ---------- Landing ---------- */
  .pt-url{ max-width:520px; margin:1.4rem auto 0; padding:.95rem 1.3rem; border-radius:999px; border:1px solid var(--line-2); background:rgba(255,255,255,.04); font-size:.96rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pt-aviso{ max-width:560px; margin:1.4rem auto 0; padding:1rem 1.2rem; border-radius:18px; border:1px dashed var(--line-2); color:var(--soft); font-size:.92rem; line-height:1.5; }

  /* ---------- Textos ---------- */
  .pt-txts{ max-width:780px; margin:1.8rem auto 0; display:grid; gap:1.1rem; text-align:left; }
  .pt-txt{ border:1px solid var(--line); border-radius:26px; background:linear-gradient(165deg, var(--ink-2), var(--ink-1) 70%); padding:1.4rem 1.5rem 1.5rem; }
  @media (max-width:560px){ .pt-txt{ padding:1.15rem 1.1rem 1.2rem; border-radius:20px; } }
  .pt-txt-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; }
  .pt-txt-head h3{ font-family:var(--font-sans); font-size:.82rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--amber); }
  .pt-txt-head small{ display:block; color:var(--muted); font-size:.8rem; margin-top:.35rem; line-height:1.4; letter-spacing:0; text-transform:none; font-weight:400; }
  .pt-txt-head .btn{ flex:none; }
  .pt-txt-body{ margin-top:.9rem; font-size:1rem; line-height:1.65; color:var(--cream); white-space:pre-line; overflow-wrap:anywhere; }
  .pt-txt-body.is-empty{ color:var(--muted); }
  .pt-en{ margin-top:1rem; border:1px solid var(--line); border-radius:18px; padding:.85rem 1rem; background:rgba(255,255,255,.025); }
  .pt-en span{ font-size:.7rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .pt-en span em{ font-style:normal; letter-spacing:0; text-transform:none; font-weight:500; }
  .pt-en p{ margin-top:.4rem; color:var(--soft); font-size:.94rem; line-height:1.6; white-space:pre-line; overflow-wrap:anywhere; }
  .pt-en p.is-empty{ color:var(--muted); }
  .pt-pend{ margin-top:1rem; border:1px solid color-mix(in srgb, var(--amber) 55%, transparent); background:color-mix(in srgb, var(--amber) 7%, transparent); border-radius:18px; padding:.85rem 1rem; }
  .pt-pend .top{ display:flex; justify-content:space-between; align-items:center; gap:.8rem; flex-wrap:wrap; }
  .pt-chip{ display:inline-flex; align-items:center; gap:.35rem; font-size:.66rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:.28rem .65rem; border-radius:999px; }
  .pt-chip.pendiente{ background:color-mix(in srgb, var(--amber) 18%, transparent); color:var(--amber); }
  .pt-chip.aplicado{ background:color-mix(in srgb, var(--green) 18%, transparent); color:var(--green); }
  .pt-chip.rechazado{ background:color-mix(in srgb, var(--red) 18%, transparent); color:#F07F92; }
  .pt-pend small{ color:var(--muted); font-size:.78rem; }
  .pt-pend p{ margin-top:.5rem; color:var(--cream); font-size:.94rem; line-height:1.6; white-space:pre-line; overflow-wrap:anywhere; }
  .pt-pend p.is-empty{ color:var(--muted); font-style:italic; }
  .pt-form textarea, .pt-form input{ width:100%; margin-top:.9rem; background:var(--ink); border:1px solid var(--line-2); border-radius:16px; padding:.85rem 1rem; color:var(--cream); font-family:var(--font-sans); font-size:.98rem; line-height:1.55; resize:vertical; }
  .pt-form textarea:focus, .pt-form input:focus{ outline:none; border-color:var(--amber); }
  .pt-form .row{ display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-top:.7rem; flex-wrap:wrap; }
  .pt-form .cnt{ color:var(--muted); font-size:.78rem; }
  .pt-form .acc{ display:flex; gap:.6rem; align-items:center; }

  .pt-pedidos{ max-width:780px; margin:1.6rem auto 0; text-align:left; border:1px solid var(--line); border-radius:22px; background:var(--ink-1); overflow:hidden; }
  .pt-ped{ padding:1rem 1.2rem; border-bottom:1px solid var(--line); }
  .pt-ped:last-child{ border-bottom:0; }
  .pt-ped .top{ display:flex; justify-content:space-between; align-items:center; gap:.8rem; flex-wrap:wrap; }
  .pt-ped b{ font-size:.9rem; }
  .pt-ped small{ color:var(--muted); font-size:.78rem; }
  .pt-ped p{ color:var(--soft); font-size:.88rem; line-height:1.5; margin-top:.4rem; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line; }
  .pt-ped .nota{ margin-top:.45rem; font-size:.84rem; color:var(--cream); }
  .pt-ped .nota em{ font-style:normal; color:var(--muted); }

  .pt-toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); z-index:200; max-width:calc(100% - 32px); padding:.85rem 1.3rem; border-radius:16px; background:var(--ink-3); border:1px solid var(--line-2); color:var(--cream); font-size:.9rem; line-height:1.4; box-shadow:0 20px 50px -18px rgba(0,0,0,.9); opacity:0; pointer-events:none; transition:.25s; text-align:center; }
  .pt-toast.on{ opacity:1; transform:translate(-50%, 0); }
  .pt-toast.con-barra{ bottom:calc(96px + env(safe-area-inset-bottom)); }

  .pt-footer{ text-align:center; color:var(--muted); font-size:.8rem; padding:2.4rem 16px 3rem; border-top:1px solid var(--line); margin-top:2rem; }
  .pt-footer a{ color:var(--soft); }
  .pt-cargando{ text-align:center; color:var(--muted); padding:5rem 16px; }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

<header class="pt-head">
  <div class="pt-head-in">
    <a href="/" class="pt-iso" aria-label="Tribu Connection — inicio"><img src="/assets/isotipo.png?v=3" alt=""></a>
    <div class="pt-me">
      <div class="pt-me-av"><span id="hdAvatar"></span></div>
      <div class="pt-me-txt"><strong id="hdNombre">&nbsp;</strong><small id="hdRol">&nbsp;</small></div>
    </div>
    <button type="button" class="pt-ic" id="btnIdioma" aria-label="Cambiar idioma">EN</button>
    <button type="button" class="pt-ic is-plain" id="btnSalir" aria-label="Cerrar sesión" title="Cerrar sesión">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>
    </button>
  </div>
</header>

<main id="portal">
  <p class="pt-cargando" id="cargando" data-i18n="cargando">Cargando tu portal…</p>

  <div id="contenido" hidden>
    <!-- ===== Hero ===== -->
    <section class="pt-sec pt-hero">
      <div class="pt-wrap">
        <div class="pt-foto" id="heroFoto"></div>
        <span class="pt-badge" id="heroRol"></span>
        <h1 class="pt-nombre" id="heroNombre"></h1>
        <p class="pt-titulo" id="heroTitulo" hidden></p>
        <h2 class="pt-bienv" data-i18n="bienv"></h2>
        <p class="pt-sub" data-i18n="bienv_txt"></p>
        <div class="pt-sep" style="margin-top:1.6rem"><i></i><img src="/assets/isotipo.png?v=3" alt=""><i></i></div>

        <div class="pt-install" id="instalar" hidden>
          <img src="/assets/pwa-192.png" alt="">
          <div>
            <h3 data-i18n="inst_t"></h3>
            <p data-i18n="inst_s"></p>
            <p id="instIos" data-i18n="inst_ios" hidden></p>
            <div class="row">
              <button type="button" class="btn btn--spectrum pt-btn-sm" id="btnInstalar" data-i18n="inst_btn"></button>
              <button type="button" class="pt-link-btn" id="btnInstalarNo" data-i18n="inst_no"></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Sin perfil todavía -->
    <section class="pt-sec" id="sinPerfil" hidden>
      <div class="pt-wrap">
        <p class="pt-eyebrow" data-i18n="tx_eyebrow"></p>
        <h2 class="pt-title" data-i18n="sinp_t"></h2>
        <p class="pt-sub" data-i18n="sinp_s"></p>
        <div class="pt-btns"><a href="/cuenta/perfil/editar/" class="btn btn--spectrum" data-i18n="sinp_btn"></a></div>
      </div>
    </section>

    <div id="conPerfil" hidden>
      <!-- ===== Tu placa ===== -->
      <section class="pt-sec" id="secPlaca">
        <div class="pt-wrap">
          <p class="pt-eyebrow">Marketing</p>
          <h2 class="pt-title" id="placaTitulo"></h2>
          <p class="pt-sub" id="sinFotoAviso" data-i18n="sin_foto" hidden></p>
          <div class="pt-placas" id="placas">
            <div class="pt-placa">
              <h4 data-i18n="fmt_post"></h4>
              <div class="pt-cv"><canvas id="cvPost" width="1080" height="1350"></canvas><div class="pt-cv-spin" id="spinFoto" hidden></div></div>
              <button type="button" class="btn btn--ghost pt-btn-sm pt-desc" data-descargar="post" data-i18n="descargar"></button>
            </div>
            <div class="pt-placa">
              <h4 data-i18n="fmt_story"></h4>
              <div class="pt-cv"><canvas id="cvStory" width="1080" height="1920"></canvas></div>
              <button type="button" class="btn btn--ghost pt-btn-sm pt-desc" data-descargar="story" data-i18n="descargar"></button>
            </div>
          </div>

          <div class="pt-btns" id="accionesFoto">

  /* Arrastrar con un dedo/mouse mueve la foto; con dos dedos (o la rueda) hace zoom. */
  function hacerArrastrable(cv, formato, getImg, getEnc, alCambiar, habilitado){
    const ptrs = new Map(); let pinch = null;
    const escala = () => cv.width / cv.getBoundingClientRect().width;
    cv.addEventListener('pointerdown', ev => {
      if(!habilitado() || !getImg()) return;
      ev.preventDefault(); try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
      ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: getEnc().zoom }; }
    });
    cv.addEventListener('pointermove', ev => {
      if(!ptrs.has(ev.pointerId)) return;
      const prev = ptrs.get(ev.pointerId); const e = getEnc(), img = getImg();
      ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if(ptrs.size === 1){
        const { w: W, h: H } = TribuPlacas.FORMATOS[formato];
        const r = TribuPlacas.cubrir(img, W, H, e.x, e.y, e.zoom);
        const s = escala();
        if(r.dw - W > 1) e.x = clamp(e.x - (ev.clientX - prev.x) * s * 100 / (r.dw - W), 0, 100);
        if(r.dh - H > 1) e.y = clamp(e.y - (ev.clientY - prev.y) * s * 100 / (r.dh - H), 0, 100);
      } else if(ptrs.size === 2 && pinch){
        const [a, b] = [...ptrs.values()];
        e.zoom = clamp(pinch.z * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d), 1, 3);
      }
      alCambiar();
    });
    const soltar = ev => { ptrs.delete(ev.pointerId); if(ptrs.size < 2) pinch = null; };
    cv.addEventListener('pointerup', soltar); cv.addEventListener('pointercancel', soltar);
    cv.addEventListener('wheel', ev => {
      if(!habilitado() || !getImg()) return;
      ev.preventDefault();
      const e = getEnc(); e.zoom = clamp(e.zoom * (1 - ev.deltaY * .0015), 1, 3); alCambiar();
    }, { passive:false });
  }

  /* Achica la foto antes de subirla (máx. 1600 px, JPG) para que cargue rápido. */
  async function achicar(file){
    const url = URL.createObjectURL(file);
    try{
      const img = await TribuPlacas.cargarImg(url);
      const max = 1600, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(r, 'image/jpeg', .9));
    } finally { URL.revokeObjectURL(url); }
  }
  async function cambiarFoto(file){
    if(!file) return;
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)){ toast(t('foto_tipo')); return; }
    const spin = $('spinFoto'); spin.textContent = t('foto_subiendo'); spin.hidden = false;
    try{
      const blob = await achicar(file);
      const path = session.user.id + '/foto.jpg';
      const { error: upErr } = await sb.storage.from('perfiles').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
      if(upErr) throw upErr;
      const url = sb.storage.from('perfiles').getPublicUrl(path).data.publicUrl + '?t=' + Date.now();
      const v = { foto_url:url, foto_pos_x:50, foto_pos_y:50, foto_zoom:1 };
      const { data: upd, error } = await sb.from('profiles').update(v).eq('id', session.user.id).select('id');
      if(error || !upd || !upd.length) throw error || new Error('sin cambios');
      Object.assign(perfil, v);
      foto = await TribuPlacas.cargarImg(url, true);
      encGuardado = { x:50, y:50, zoom:1 }; enc = { ...encGuardado };
      pintarCabecera(); pintarTodo(); toast(t('foto_ok'));
    }catch(e){ toast(t('foto_err')); }
    finally{ spin.hidden = true; $('inFoto').value = ''; }
  }

  /* ===================== Carrusel de placas (lineups) ===================== */
  function nombresPorCategoria(cat){
    return red.filter(p => {
      if(cat === 'marca' && p.tipo === 'marca') return true;
      return (p.roles || []).some(r => ROL_CAT[r] === cat) || (cat === 'creador' && !(p.roles || []).length && p.tipo !== 'marca');
    }).map(p => (p.tipo === 'marca' ? (p.nombre_marca || p.nombre) : p.nombre)).filter(Boolean);
  }
  const unico = arr => [...new Set(arr.map(s => s.trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));

  function proximosEventos(){
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const vistos = new Map();
    (window.TRIBU_EVENTS || []).forEach(e => {
      const d = new Date(e.date + 'T00:00'); if(isNaN(d) || d < hoy) return;
      if(!vistos.has(e.title) || vistos.get(e.title).d > d) vistos.set(e.title, { d, titulo:e.title, lugar:e.place || '' });
    });
    experiencias.forEach(e => {
      const d = e.fecha ? new Date(e.fecha + 'T00:00') : null; if(!d || isNaN(d) || d < hoy) return;
      if(!vistos.has(e.nombre)) vistos.set(e.nombre, { d, titulo:e.nombre, lugar: e.modalidad === 'Online' ? 'Online' : [e.lugar, e.ciudad_barrio].filter(Boolean).join(', ') });
    });
    return [...vistos.values()].sort((a, b) => a.d - b.d).slice(0, 7)
      .map(e => ({ dia:String(e.d.getDate()), mes:t('meses')[e.d.getMonth()], titulo:e.titulo, lugar:e.lugar }));
  }

  function listaPlacas(){

    if(creadores.length) out.push({ id:'creadores', titulo:t('l_creadores'), tipo:'lineup', eyebrow:t('eb_red', { y }), items:creadores, pie:t('pie_red') });
    Object.entries(DISCIPLINA_GRUPOS).forEach(([area, lista]) => {
      const n = unico(red.filter(p => (p.categorias || []).some(c => lista.includes(c))).map(p => p.tipo === 'marca' ? (p.nombre_marca || p.nombre) : p.nombre).filter(Boolean));

    });
    const evs = proximosEventos();
    if(evs.length) out.push({ id:'agenda', titulo:t('l_agenda'), tipo:'agenda', eyebrow:t('eb_agenda', { y }), eventos:evs, pie:t('pie_agenda') });
    const marcas = unico(['Bioferia Argentina', 'Expo Holística & Bienestar', 'Resonar Festival', 'Sagrada Madre', 'Unifungi', 'Amanita Festival'].concat(nombresPorCategoria('marca')));
    out.push({ id:'marcas', titulo:t('l_marcas'), tipo:'lineup', eyebrow:t('eb_red', { y }), items:marcas, pie:t('pie_red') });
    const comus = unico(['Espacio Om', 'Parque Centenario'].concat(nombresPorCategoria('comunidad'), nombresPorCategoria('lugar')));
    if(comus.length >= 3) out.push({ id:'comunidades', titulo:t('l_comunidades'), tipo:'lineup', eyebrow:t('eb_red', { y }), items:comus, pie:t('pie_red') });
    return out;

  function campos(){
    return [
      { k: campoNombre(), label:'f_nombre', help:'h_nombre', max:80, input:true },
      { k:'titulo_profesional', label:'f_titulo', help:'h_titulo', max:90, input:true, en:true },

  const ETIQUETA_CAMPO = { nombre:'f_nombre', nombre_marca:'f_nombre', titulo_profesional:'f_titulo', mini_bio:'f_frase', bio_larga:'f_bio', que_esperar:'f_esperar', otro:'campo_otro' };
  const fechaCorta = iso => { const d = new Date(iso); return d.getDate() + ' ' + t('meses')[d.getMonth()] + ' ' + d.getFullYear(); };
  const pendienteDe = k => pedidos.find(p => p.campo === k && p.estado === 'pendiente');

  function pintarTextos(){
    $('txSub').textContent = revisado() ? t('tx_sub_rev') : t('tx_sub_norev');

          (c.en ? '<div class="pt-en"><span>' + esc(t('en_label')) + ' · <em>' + esc(t('en_nota')) + '</em></span><p' + (perfil[c.k + '_en'] ? '' : ' class="is-empty"') + '>' + esc(perfil[c.k + '_en'] || t('vacio')) + '</p></div>' : '') +
        '</div>';
      card.querySelector('[data-editar]').addEventListener('click', () => editarCampo(card, c));

  function editarCampo(card, c){
    const actual = perfil[c.k] || '';
    const pend = pendienteDe(c.k);
    const inicial = pend ? pend.valor_nuevo : actual;
    const cuerpo = card.querySelector('[data-cuerpo]');
    card.querySelector('[data-editar]').hidden = true;
    cuerpo.innerHTML = '<form class="pt-form">' +
      (c.input ? '<input maxlength="' + c.max + '">' : '<textarea rows="' + (c.max > 300 ? 7 : 3) + '" maxlength="' + c.max + '"></textarea>') +
      '<div class="row"><span class="cnt"><span>0</span> / ' + c.max + '</span><div class="acc">' +
        '<button type="button" class="pt-link-btn" data-x>' + esc(t('cancelar')) + '</button>' +
        '<button type="submit" class="btn btn--spectrum pt-btn-sm">' + esc(revisado() ? t('enviar_rev') : t('guardar')) + '</button>' +
      '</div></div></form>';
    const f = cuerpo.querySelector('form'), campo = f.querySelector('input, textarea'), cnt = f.querySelector('.cnt span');
    campo.value = inicial; cnt.textContent = inicial.length;
    campo.addEventListener('input', () => { cnt.textContent = campo.value.length; });
    campo.focus();
    f.querySelector('[data-x]').addEventListener('click', pintarTextos);
    f.addEventListener('submit', async ev => {
      ev.preventDefault();
      const v = campo.value.trim();
      if(v.length > c.max){ toast(t('muy_largo')); return; }
      if(c.k === campoNombre() && !v){ campo.focus(); return; }
      const btn = f.querySelector('[type=submit]'); btn.disabled = true;
      try{
        if(!revisado()){
          if(v === actual){ toast(t('sin_cambios')); pintarTextos(); return; }
          const { data: upd, error } = await sb.from('profiles').update({ [c.k]: v || null }).eq('id', session.user.id).select('id');
          if(error || !upd || !upd.length) throw error || new Error('sin cambios');
          perfil[c.k] = v || null;
          toast(t('tx_guardado'));
        } else {
          if(v === actual && !pend){ toast(t('sin_cambios')); pintarTextos(); return; }
          if(pend){ const { error: de } = await sb.from('cambios_perfil').delete().eq('id', pend.id); if(de) throw de; }
          if(v !== actual){
            const { data, error } = await sb.from('cambios_perfil').insert({ profile_id: session.user.id, campo: c.k, valor_anterior: actual, valor_nuevo: v }).select().single();
            if(error) throw error;
            avisarEquipo(data, t(c.label));
            toast(t('tx_enviado'));
          } else toast(t('pedido_cancelado'));
          await cargarPedidos();
        }
        pintarCabecera(); pintarTodo();
      }catch(e){ btn.disabled = false; toast(t('err_gen')); }
    });
  }

  async function cancelarPedido(id){

        '<span><span class="pt-chip ' + esc(p.estado) + '">' + esc(t('est_' + p.estado)) + '</span> <small>' + esc(fechaCorta(p.revisado_at || p.created_at)) + '</small></span></div>' +
        '<p>' + esc(p.valor_nuevo || t('rev_vacio')) + '</p>' +
        (p.nota_equipo ? '<div class="nota"><em>' + esc(t('nota_equipo')) + '</em> ' + esc(p.nota_equipo) + '</div>' : '') +
      '</div>').join('');
  }

  async function cargarPedidos(){
    const { data } = await sb.from('cambios_perfil').select('*').eq('profile_id', session.user.id).order('created_at', { ascending:false });
    pedidos = data || [];
  }

  /* ===================== Modal "Pedir cambios" ===================== */
  function abrirModal(){ const o = $('modalPedir'); o.classList.add('open'); o.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; setTimeout(() => $('mpTexto').focus(), 50); }
  function cerrarModal(){ const o = $('modalPedir'); o.classList.remove('open'); o.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
  $('btnPedir').addEventListener('click', abrirModal);
  $('mpCerrar').addEventListener('click', cerrarModal);
  $('modalPedir').addEventListener('click', e => { if(e.target === $('modalPedir')) cerrarModal(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('modalPedir').classList.contains('open')) cerrarModal(); });
  $('mpTexto').addEventListener('input', () => { $('mpCnt').textContent = $('mpTexto').value.length; });
  $('formPedir').addEventListener('submit', async e => {
    e.preventDefault();
    const v = $('mpTexto').value.trim(); if(!v) return;
    const btn = $('mpEnviar'); btn.disabled = true;
    const { data, error } = await sb.from('cambios_perfil').insert({ profile_id: session.user.id, campo:'otro', valor_nuevo:v }).select().single();
    btn.disabled = false;
    if(error){ toast(t('err_gen')); return; }
    avisarEquipo(data, t('campo_otro'));
    $('mpTexto').value = ''; $('mpCnt').textContent = '0';
    cerrarModal(); await cargarPedidos(); pintarPedidos(); toast(t('md_ok'));
  });

  /* ===================== Instalar como app ===================== */
  let promptInstalar = null;
  const esStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const esIos = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const esMovil = esIos || /Android|Mobile/i.test(navigator.userAgent);
  function instalarDescartado(){ try{ const v = +localStorage.getItem('tribu_portal_instalar_no'); return v && Date.now() - v < 30 * 864e5; }catch(e){ return false; } }
  function mostrarInstalar(){
    if(esStandalone() || instalarDescartado() || !esMovil) return;
    if(!promptInstalar && !esIos) return;
    $('instalar').hidden = false;
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; mostrarInstalar(); });
  window.addEventListener('appinstalled', () => { $('instalar').hidden = true; });
  $('btnInstalar').addEventListener('click', async () => {
    if(promptInstalar){ promptInstalar.prompt(); const r = await promptInstalar.userChoice.catch(() => null); promptInstalar = null; if(r && r.outcome === 'accepted') $('instalar').hidden = true; return; }
    $('instIos').hidden = false; $('btnInstalar').hidden = true;
  });
  $('btnInstalarNo').addEventListener('click', () => { try{ localStorage.setItem('tribu_portal_instalar_no', String(Date.now())); }catch(e){} $('instalar').hidden = true; });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/cuenta/portal/sw.js', { scope:'/cuenta/portal/' }).catch(() => {});

  /* ===================== Eventos de la página ===================== */
  $('btnIdioma').addEventListener('click', () => { lang = lang === 'es' ? 'en' : 'es'; try{ localStorage.setItem('tribu_portal_lang', lang); }catch(e){} aplicarIdioma(); });
  $('btnSalir').addEventListener('click', () => tribuCerrarSesion());
  $('btnAjustar').addEventListener('click', entrarEdicion);
  $('btnCancelarEnc').addEventListener('click', salirEdicion);
  $('btnGuardarEnc').addEventListener('click', guardarEncuadre);
  $('btnCentrar').addEventListener('click', () => { enc = { x:50, y:50, zoom:1 }; $('zoom').value = 1; pintarPlacas(); });
  $('zoom').addEventListener('input', () => { enc.zoom = parseFloat($('zoom').value); pintarPlacas(); });
  $('inFoto').addEventListener('change', e => cambiarFoto(e.target.files[0]));
  $('inExtra').addEventListener('change', e => agregarExtra(e.target.files[0]));
  const drop = $('dropExtra');
  ['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => agregarExtra(e.dataTransfer.files[0]));
  document.querySelectorAll('[data-descargar]').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.descargar; TribuPlacas.descargar(f === 'post' ? $('cvPost') : $('cvStory'), archivo(f === 'post' ? 'placa-4x5' : 'placa-9x16'));
  }));
  ['cvPost', 'cvStory'].forEach(id => hacerArrastrable($(id), id === 'cvPost' ? 'post' : 'story', () => foto, () => enc, () => { $('zoom').value = enc.zoom; pintarPlacas(); }, () => editando));
  async function copiar(texto, btn, okKey){
    try{ await navigator.clipboard.writeText(texto); }
    catch(e){ const ta = document.createElement('textarea'); ta.value = texto; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); }
    const prev = btn.textContent; btn.textContent = t(okKey); setTimeout(() => { btn.textContent = prev; }, 1800);
  }
  /* El carrusel se empuja con el mouse como si se arrastrara con la mano.
     Si el gesto fue un arrastre y no un clic, no se dispara la descarga. */
  (function(){
    const c = $('carrusel');
    let agarrado = false, xIni = 0, scrollIni = 0, movido = 0;
    c.addEventListener('pointerdown', ev => {
      if(ev.pointerType !== 'mouse' || ev.button !== 0) return;
      agarrado = true; movido = 0; xIni = ev.clientX; scrollIni = c.scrollLeft;
      c.classList.add('arrastrando');
      try{ c.setPointerCapture(ev.pointerId); }catch(e){}
    });
    c.addEventListener('pointermove', ev => {
      if(!agarrado) return;
      const d = ev.clientX - xIni;
      movido = Math.max(movido, Math.abs(d));
      if(movido > 3) ev.preventDefault();
      c.scrollLeft = scrollIni - d;
    });
    const soltar = () => { if(!agarrado) return; agarrado = false; c.classList.remove('arrastrando'); };
    c.addEventListener('pointerup', soltar);
    c.addEventListener('pointercancel', soltar);
    c.addEventListener('click', ev => { if(movido > 6){ ev.preventDefault(); ev.stopPropagation(); movido = 0; } }, true);
    c.addEventListener('dragstart', ev => ev.preventDefault());
  })();

  $('btnCopiarCaption').addEventListener('click', e => copiar($('caption').textContent, e.currentTarget, 'copiado'));
  $('btnCopiarLink').addEventListener('click', e => copiar(linkLargo(), e.currentTarget, 'link_copiado'));
  $('btnCompartir').addEventListener('click', e => {
    if(navigator.share){ navigator.share({ title: nombreVisible() + ' · Tribu Connection', url: linkLargo() }).catch(() => {}); return; }
    copiar(linkLargo(), e.currentTarget, 'link_copiado');
  });
  window.addEventListener('beforeunload', e => { if(editando){ e.preventDefault(); e.returnValue = ''; } });

  function pintarTodo(){
    if(!perfil) return;
    $('sinFotoAviso').hidden = !!foto;
    $('btnAjustar').hidden = !foto;
    $('btnCambiarFoto').textContent = foto ? t('cambiar') : t('subir');
    pintarPlacas(); pintarCarrusel(); pintarCaption(); pintarExtras(); pintarLanding(); pintarTextos(); pintarPedidos();
  }

  /* ===================== Carga ===================== */
  aplicarIdioma();
  (async () => {
    session = await tribuRequiereSesion();
    if(!session) return;
    esEquipo = await tribuEsAdmin();
    const [{ data: p }, , { data: rp }, { data: exps }] = await Promise.all([
      sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle(),
      TribuPlacas.preparar(),
      sb.from('perfiles_publicos').select('id,tipo,nombre,nombre_marca,roles,categorias').eq('publicado', true).eq('comparte_perfil', true),
      sb.from('experiences').select('nombre,fecha,lugar,ciudad_barrio,modalidad').eq('estado_publicacion', 'publicado')
    ]);
    perfil = p || null;
    red = rp || []; experiencias = exps || [];
    if(perfil){
      encGuardado = { x: perfil.foto_pos_x == null ? 50 : perfil.foto_pos_x, y: perfil.foto_pos_y == null ? 50 : perfil.foto_pos_y, zoom: perfil.foto_zoom || 1 };
      if(perfil.foto_url){ try{ foto = await TribuPlacas.cargarImg(perfil.foto_url, true); }catch(e){ foto = null; } }
      await cargarPedidos();
    }
    $('cargando').hidden = true; $('contenido').hidden = false; $('footer').hidden = false;
    $('sinPerfil').hidden = !!perfil; $('conPerfil').hidden = !perfil;
    pintarCabecera(); pintarTodo(); mostrarInstalar();
    document.addEventListener('tribu:events-updated', () => { if(perfil) pintarCarrusel(); });
  })();
})();
</script>
</body>
